name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release:
    name: 'Create release'

    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    uses: eliashaeussler/gha/.github/workflows/github-release.yaml@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32

  deploy-prod:
    name: 'Deploy to production'
    runs-on: ubuntu-latest

    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    environment:
      name: production
      url: https://typo3-badges.dev

    concurrency:
      group: prod
      cancel-in-progress: true

    permissions:
      contents: read

    env:
      APP_ENV: prod

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          php-version: 8.5

      - name: 'Install Composer packages'
        uses: eliashaeussler/gha/.github/actions/composer-install@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: 'Build assets'
        uses: eliashaeussler/gha/.github/actions/build-assets@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32

      - name: 'Deploy'
        uses: eliashaeussler/gha/.github/actions/deploy-app@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deployer-version: '8.0.5'

  deploy-dev:
    name: 'Deploy to development'
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' }}

    environment:
      name: development
      url: https://pre.typo3-badges.dev

    concurrency:
      group: dev
      cancel-in-progress: true

    permissions:
      contents: read

    env:
      APP_ENV: dev

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32

      - name: 'Setup PHP'
        uses: eliashaeussler/gha/.github/actions/setup-php@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          php-version: 8.5

      - name: 'Install Composer packages'
        uses: eliashaeussler/gha/.github/actions/composer-install@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: 'Build assets'
        uses: eliashaeussler/gha/.github/actions/build-assets@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32

      - name: 'Deploy'
        uses: eliashaeussler/gha/.github/actions/deploy-app@7e16bdf568d9d36b2b0f89631a67e742d6daf44a # 1.1.32
        with:
          command: dev
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deployer-version: '8.0.5'
