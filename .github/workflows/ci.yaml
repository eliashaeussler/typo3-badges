name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: 'Prepare workflow'
    uses: eliashaeussler/gha/.github/workflows/preparation.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26

  checks:
    name: 'Checks'

    needs: [prepare]
    if: ${{ needs.prepare.outputs.continue == 'true' }}

    permissions:
      contents: read
      security-events: write

    uses: eliashaeussler/gha/.github/workflows/checks.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26
    with:
      npm: true

  devsecops:
    name: 'DevSecOps'

    needs: [prepare]
    if: ${{ needs.prepare.outputs.continue == 'true' }}

    permissions:
      contents: read

    secrets:
      DEVGUARD_TOKEN: ${{ secrets.DEVGUARD_TOKEN }}

    uses: eliashaeussler/gha/.github/workflows/devsecops.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26
    with:
      devguard-asset-name: elias-haeussler/projects/typo3-badges/assets/typo3-badges

  tests:
    name: 'Tests'

    needs: [prepare]
    if: ${{ needs.prepare.outputs.continue == 'true' }}

    uses: eliashaeussler/gha/.github/workflows/composer-test-coverage.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26
    with:
      build-command: 'build'
